# Interpretações propostas por IA (PREMISSAS.md §3.4, nível C).
#
# NÃO equivalem a revisão humana. Cada decisão tomada a partir delas leva
# `revisado_por: ia:<modelo>` e `interpretacoes_ia: [ids]`, e a consulta mostra
# isso. Cada interpretação só vale com citação literal: o pipeline confere cada
# trecho no arquivo citado (normas/ ou fontes/) antes de aplicar qualquer decisão.
# Uma decisão humana, quando houver, prevalece sobre a da IA.
#
# Autorizadas pelo usuário em 2026-10-15 ("Sim, implemente e aplique o nível C"),
# depois de ele declarar que não pode aprovar as regras derivadas abaixo.
modelo: claude-opus-5-5
interpretacoes:
  - id: lc227-republicacao-e-retificacao
    norma: lc-227-2026
    registrado_em: '2026-10-15'
    resolve_pendencias:
      - republicacao_de_artigos
      - retificacao
      - rodape_cita_publicacao_nao_confirmada
    leitura: >-
      A LC 227 foi publicada no DOU de 14/01/2026 (página arquivada). A
      republicação é declarada "parcial" e o único trecho republicado é um item
      vetado ("I - (VETADO);") que o art. 174 insere na LC 214 — não há texto
      normativo nele. A retificação ("onde se lê ... leia-se") só acrescenta o
      título "PARTE QUINTA" ao texto que o art. 172 insere na Lei nº 1.079/1950.
      Lidos assim, nenhum dos dois atos traz texto da LC 227 que passe a valer em
      outra data: a publicação que vale para "entra em vigor na data de sua
      publicação" (art. 182) e para "a partir da sua publicação" (art. 182, III) é
      a de 14/01/2026, para todos os artigos, inclusive o 172 e o 174.
    citacoes:
      - fonte: fontes/lc-227-2026/texto_publicado.html
        trecho: "Publicado em: 14/01/2026 | Edição: 9 | Seção: 1 | Página: 1"
      - fonte: normas/lc-227-2026/art-0182.md
        trecho: "Esta Lei Complementar entra em vigor na data de sua publicação, produzindo efeitos:"
      - fonte: normas/lc-227-2026/art-0182.md
        trecho: "III - a partir da sua publicação, em relação aos demais dispositivos."
      - fonte: fontes/lc-227-2026/texto_republicado.doc
        trecho: >-
          Republicação parcial da Lei Complementar nº 227, de 13 de janeiro de
          2026, publicada na Edição nº 9, do Diário Oficial da União de 14 de
          janeiro de 2026, Seção 1, página 1, por ter constado inexatidão material.
      - fonte: fontes/lc-227-2026/texto_republicado.doc
        trecho: "I - (VETADO);"
      - fonte: normas/lc-227-2026/art-0174.md
        trecho: "A Lei Complementar nº 214, de 16 de janeiro de 2025, passa a vigorar com as seguintes alterações:"
      - fonte: fontes/lc-227-2026/texto_retificado.doc
        trecho: "Art. 172. A Lei nº 1.079, de 10 de abril de 1950, passa a vigorar acrescida da seguinte Parte Quinta:"
      - fonte: fontes/lc-227-2026/texto_retificado.doc
        trecho: "PARTE QUINTA"

  - id: texto-alterado-pela-lc-227
    regra: texto-alterado-por-ato-posterior
    registrado_em: '2026-10-15'
    leitura: >-
      O art. 174 da LC 227 dá nova redação e inclui texto na LC 214, e o art. 181
      revoga dispositivos dela. O art. 182 da LC 227 diz que ela entra em vigor na
      publicação e que os demais dispositivos — entre eles o 174 e o 181 —
      produzem efeitos a partir da publicação. O texto que o art. 174 inclui ou
      altera não existia antes disso; e a LC 214, no art. 544, dá a cada artigo
      dela uma data de efeitos. Lidas juntas: o trecho incluído ou com redação dada
      vale a partir da mais tardia das duas datas (vigência e efeitos, cada um com
      o seu par); o trecho revogado pelo art. 181 deixa de valer quando o art. 181
      produz efeitos.
    citacoes:
      - fonte: normas/lc-227-2026/art-0174.md
        trecho: "A Lei Complementar nº 214, de 16 de janeiro de 2025, passa a vigorar com as seguintes alterações:"
      - fonte: normas/lc-227-2026/art-0181.md
        trecho: "V - os seguintes dispositivos da Lei Complementar nº 214, de 16 de janeiro de 2025:"
      - fonte: normas/lc-227-2026/art-0182.md
        trecho: "Esta Lei Complementar entra em vigor na data de sua publicação, produzindo efeitos:"
      - fonte: normas/lc-227-2026/art-0182.md
        trecho: "III - a partir da sua publicação, em relação aos demais dispositivos."
      - fonte: normas/lc-214-2025/art-0544.md
        trecho: "Esta Lei Complementar entra em vigor na data de sua publicação, produzindo efeitos:"

  - id: item-vetado-sem-texto
    trata: vetado
    registrado_em: '2026-10-15'
    leitura: >-
      Um item marcado "(VETADO)" no lugar do texto não tem texto normativo: o
      compilado mostra só o rótulo do dispositivo e a marca do veto. Não há, nele,
      o que passe a valer ou produzir efeitos, e ele não muda as datas que a
      cláusula de vigência dá ao resto do artigo. Isso não vale quando o próprio
      caput é vetado — aí o artigo inteiro não tem texto e fica sem datas — nem
      quando o item vetado depois foi promulgado (anotação de promulgação de
      partes vetadas), que é texto de outro ato. Item vetado que a lei alteradora
      incluiu também não tem texto: não vira exceção com datas.
    citacoes:
      - fonte: normas/lc-214-2025/art-0036.md
        trecho: "§ 2º (VETADO)."
      - fonte: normas/lc-214-2025/art-0116.md
        trecho: "§ 5º (VETADO). (Incluído pela Lei Complementar nº 227, de 2026)"
      - fonte: normas/lc-214-2025/art-0334.md
        trecho: "Art. 334. (VETADO)."

  - id: efeitos-na-vigencia-sem-clausula-de-efeitos
    trata: efeitos_da_vigencia
    registrado_em: '2026-10-15'
    leitura: >-
      A cláusula da EC 132 (art. 23) e a da LC 235 (art. 17) dizem quando cada
      dispositivo "entra em vigor" e nada dizem sobre quando produz efeitos — ao
      contrário da LC 214 e da LC 227, que dizem "produzindo efeitos". Sem
      cláusula de efeitos, o dispositivo produz efeitos desde a vigência. Datas e
      prazos no próprio texto — valores por exercício ("I - em 2029, a R$
      8.000.000.000,00"), períodos de aplicação ("no exercício de 2026"), prazos
      para agir — são conteúdo do dispositivo e não mudam o início dos efeitos.
      A leitura não vale para artigo que fixa o próprio tempo (cláusula temporal
      própria), que depende de lei futura, que tem datas por subdivisão ou que
      revoga com data (aí a data é o próprio efeito do artigo).
    citacoes:
      - fonte: normas/emc-132-2023/art-0023.md
        trecho: "Esta Emenda Constitucional entra em vigor:"
      - fonte: normas/lc-235-2026/art-0017.md
        trecho: "Esta Lei Complementar entra em vigor na data de sua publicação."
      - fonte: normas/emc-132-2023/art-0013.md
        trecho: "I - em 2029, a R$ 8.000.000.000,00 (oito bilhões de reais);"
      - fonte: normas/lc-235-2026/art-0001.md
        trecho: "Em caráter extraordinário, no exercício de 2026"

  - id: mencao-a-vigencia-e-conteudo
    trata: mencao_temporal_e_conteudo
    registrado_em: '2026-10-15'
    dispositivos:
      - urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art10
      - urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art11
      - urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art21
      - urn:lex:br:federal:lei.complementar:2025-01-16;214!art16
      - urn:lex:br:federal:lei.complementar:2025-01-16;214!art126
      - urn:lex:br:federal:lei.complementar:2025-01-16;214!art165
      - urn:lex:br:federal:lei.complementar:2025-01-16;214!art373
      - urn:lex:br:federal:lei.complementar:2025-01-16;214!art374
      - urn:lex:br:federal:lei.complementar:2025-01-16;214!art517
    leitura: >-
      Nestes dispositivos, "entrada em vigor" ou "produzirá efeitos" no próprio
      texto não fixa quando o dispositivo vale: refere-se a outra coisa, e é
      conteúdo. EC 132, art. 10: prazo da carga tributária ("até o final do quinto
      ano da entrada em vigor do regime"); art. 11: alcance de uma revogação sobre
      certas contribuições; art. 21: contratos anteriores às leis instituidoras.
      LC 214, art. 126, § 2º: regra para futuras alterações das listas; art. 165,
      § 3º: o ano-calendário de referência; arts. 373 e 374: os contratos
      alcançados; art. 517, § 11: o efeito de uma faculdade do contribuinte. O
      art. 16 só estava marcado porque o art. 517, § 11 o cita. Fica de fora o
      art. 19, II da LC 214 ("somente entrará em vigor com o início da produção de
      efeitos do ajuste"), que é cláusula do tempo do próprio inciso, com termo de
      evento sem data.
    citacoes:
      - fonte: normas/emc-132-2023/art-0010.md
        trecho: "até o final do quinto ano da entrada em vigor do regime"
      - fonte: normas/emc-132-2023/art-0011.md
        trecho: "não produzirá efeitos sobre as contribuições incidentes sobre a receita ou o faturamento"
      - fonte: normas/emc-132-2023/art-0021.md
        trecho: "contratos firmados anteriormente à entrada em vigor das leis instituidoras dos tributos"
      - fonte: normas/lc-214-2025/art-0126.md
        trecho: "A alteração das operações com bens ou com serviços beneficiadas pelos regimes diferenciados de que trata este Capítulo"
      - fonte: normas/lc-214-2025/art-0165.md
        trecho: "no ano-calendário anterior àquele da entrada em vigor desta Lei Complementar"
      - fonte: normas/lc-214-2025/art-0373.md
        trecho: "Este Capítulo dispõe sobre os instrumentos de ajuste para os contratos firmados anteriormente à entrada em vigor desta Lei Complementar."
      - fonte: normas/lc-214-2025/art-0374.md
        trecho: "Os contratos vigentes na entrada em vigor desta Lei Complementar"
      - fonte: normas/lc-214-2025/art-0517.md
        trecho: "A faculdade a que se refere o § 9º produzirá efeitos a partir da data do início de atividade"
