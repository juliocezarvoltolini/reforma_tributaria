  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art151
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    - evento_publicacao
    trecho: Art. 151. Fica autorizada, até 31 de dezembro de 2032, a aplicação, no âmbito da CBS, dos atos normativos e das documentações técnicas publicados até a data de publicação deste Regulamento, referentes à especificação de documentos fiscais, inclusive quanto a leiautes, padrões técnicos e campos informacionais, editados pelo CGNFS-e, pelo Comitê Gestor do Simples Nacional – CGSN e pelo Conselho Nacional de Política Fazendária – CONFAZ, por meio do Sistema Nacional Integrado de Informações Econômico-Fiscais – Sinief, instituído pelo Convênio s/nº, de 15 de dezembro de 1970, publicado no Diário Oficial da União de 18 de fevereiro de 1971, e pela RFB, naquilo que não contrarie o disposto neste Regulamento.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art151_par2
    tipos:
    - evento_publicacao
    trecho: § 2º A partir da data de publicação deste Regulamento, os atos conjuntos da RFB e do CGIBS referentes à especificação de documentos fiscais deverão ser encaminhados para manifestação prévia do CGNFS-e, do CGSN ou do CONFAZ, sempre que a alteração proposta possa causar impacto operacional ou informacional sobre documentos fiscais relacionados a NFS-e, a optantes pelo Simples Nacional ou ao ICMS, respectivamente.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art151_par3_incI
    tipos:
    - prazo_relativo
    trecho: I - a RFB e o CGIBS aguardarão a manifestação do CGNFS-e, do CGSN ou do CONFAZ sobre o ato proposto pelo prazo de quinze dias, prorrogável por até igual período, considerando-se tacitamente aceita a proposta caso não haja manifestação no referido prazo;
