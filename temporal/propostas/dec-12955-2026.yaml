    trecho: Art. 518. De 1º de janeiro de 2027 até 31 de dezembro de 2032, farão jus a crédito presumido da CBS os projetos habilitados à fruição dos benefícios estabelecidos pelo art. 11-C da Lei nº 9.440, de 14 de março de 1997, e pelos art. 1º a art. 4º da Lei nº 9.826, de 23 de agosto de 1999. (Art. 309 da Lei Complementar nº 214, de 16 de janeiro de 2025) (Produção de efeitos)
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art518_par1_incII_ali-a
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: a) projetos aprovados até 31 de dezembro de 2024, de pessoas jurídicas que, em 20 de dezembro de 2023, estavam habilitadas à fruição dos benefícios estabelecidos pelo art. 11-C da Lei nº 9.440, de 14 de março de 1997, e pelos art. 1º a art. 4º da Lei nº 9.826, de 23 de agosto de 1999; e
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art518_par1_incII_ali-b
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: b) novos projetos, aprovados até 31 de dezembro de 2025, que ampliem ou reiniciem a produção em planta industrial utilizada em projetos ativos ou inativos habilitados à fruição dos benefícios estabelecidos pelo art. 11-C da Lei nº 9.440, de 14 de março de 1997, e pelos art. 1º a art. 4º da Lei nº 9.826, de 23 de agosto de 1999.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art518_par3_incI
    tipos:
