  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art164_par11
    tipos:
    - prazo_relativo
    trecho: § 11. O beneficiário que realizar importação com suspensão do pagamento nos termos do inciso III do caput e não destinar os bens na forma nele prevista no prazo de três anos, contado da data de registro da declaração de importação, fica obrigado a recolher a CBS não paga em decorrência da suspensão usufruída, acrescido de multa e juros de mora nos termos do art. 27, § 2º, calculado a partir da data de ocorrência do fato gerador.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art164_par12
    tipos:
    - prazo_relativo
    trecho: § 12. O beneficiário que realizar a aquisição no mercado interno com suspensão do pagamento nos termos do inciso V do caput e não destinar o bem às atividades nele previstas no prazo de três anos, contado da data de aquisição, fica obrigado a recolher a CBS não paga em decorrência da suspensão usufruída, acrescido de multa e juros de mora nos termos do art. 27, § 2º, calculado a partir da data de ocorrência do respectivo fato gerador.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art164_par15
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: § 15. As suspensões da CBS previstas no caput somente serão aplicadas aos fatos geradores ocorridos até 31 de dezembro de 2040.
