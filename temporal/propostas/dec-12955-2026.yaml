  marcos_proprios:
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art96_par2
    tipos:
    - prazo_relativo
    trecho: § 2º A comprovação de exportação a que se refere o caput e o § 1º deve ser realizada no prazo de até cento e oitenta dias, contado da emissão do documento fiscal.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art96_par3
    tipos:
    - prazo_relativo
    trecho: '§ 3º O prazo referido no § 2º poderá ser prorrogado por até cento e oitenta dias, na forma de ato conjunto da RFB e do CGIBS, nas hipóteses em que a impossibilidade de comprovação decorrer de situação não imputável ao exportador e que possua nexo causal direto com o atraso, nas seguintes situações:'
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art96_par3_incIV
    tipos:
    - prazo_relativo
    trecho: IV - interrupção ou atraso logístico relevante, devidamente comprovado por documentação do transportador ou operador logístico, que inviabilize o embarque ou transposição de fronteira no prazo original; e
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art96_par4
    tipos:
    - prazo_relativo
    trecho: § 4º A ampliação do prazo não poderá ser utilizada de forma genérica ou por prazo indeterminado, devendo restringir-se ao tempo estritamente necessário à superação da situação excepcional que a motivou.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art96_par5
    tipos:
    - prazo_relativo
    trecho: § 5º Após o decurso do prazo a que se refere o § 2º sem a comprovação da exportação, considera-se ocorrida operação onerosa e será exigido do exportador, com os devidos acréscimos legais, a CBS incidente na operação, inclusive o relativo à operação de que trata o art. 92, § 2º, inciso II.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art96_par6
    tipos:
    - prazo_relativo
    trecho: § 6º O recolhimento do tributo não será exigido na devolução do bem ao remetente, desde que observado o prazo previsto no § 2º.
