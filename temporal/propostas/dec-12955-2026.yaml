    - data_explicita
    trecho: 'Art. 605. O contribuinte sujeito ao regime regular da CBS poderá apropriar crédito presumido da referida contribuição sobre o estoque de bens materiais existente em 1º de janeiro de 2027, nas seguintes hipóteses: (Art. 381 da Lei Complementar nº 214, de 16 de janeiro de 2025)'
