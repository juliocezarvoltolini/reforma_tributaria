decisoes_necessarias:
- id: depende_de_lei_futura
  pergunta: 'Há artigos que dependem de lei futura: transitórios (''Até que lei complementar...'') ou que remetem a ela (''Lei complementar definirá...''). Se a lei foi editada, o efeito muda, mas verificar isso é interpretação (camada 3) e exige a norma regulamentadora. Registrar como pendente em /lacunas/ até lá? O rótulo `depende_de_lei_futura` tem cobertura parcial: sua ausência não prova que não há dependência.'
