  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art605_incIII
    tipos:
    - ano
    trecho: III - em relação à parcela do valor dos bens em estoque sujeita à vedação parcial de creditamento estabelecida pelo art. 3º, § 7º a § 9º, da Lei nº 10.637, de 30 de dezembro de 2002, e da Lei nº 10.833, de 29 de dezembro 2003.
