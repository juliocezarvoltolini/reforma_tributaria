  marcos_proprios:
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art39_par1
    tipos:
    - condicao_ate_que
    trecho: § 1º Formalizado o pedido de ressarcimento, o valor solicitado não será utilizado para compensação dos débitos de que trata o art. 53, até que seja concluída a sua apreciação.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art39_par6_incI
    tipos:
    - prazo_relativo
    trecho: I - formalizar o pedido de ressarcimento até o prazo previsto no caput, observado o disposto no § 8º; ou
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art39_par8_incII
    tipos:
    - prazo_relativo
    trecho: II - na hipótese do § 4º, o pedido de ressarcimento não for formalizado até o prazo previsto no caput;
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art39_par9
    tipos:
    - prazo_relativo
    trecho: '§ 9º O prazo para apreciação do pedido de ressarcimento pela RFB, contado da data da solicitação de que trata o caput deste artigo, será de:'
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art39_par10
    tipos:
    - prazo_relativo
    trecho: § 10. Se não houver manifestação da RFB nos prazos previstos no § 9º, o crédito será ressarcido ao contribuinte nos quinze dias subsequentes. (Art. 39, § 4º, da Lei Complementar nº 214, de 16 de janeiro de 2025)
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art39_par11
    tipos:
    - prazo_relativo
    trecho: '§ 11. Caso seja iniciado procedimento de fiscalização relativo ao pedido de ressarcimento antes do encerramento dos prazos estabelecidos no § 9º, serão:'
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art39_par11_incI
    tipos:
    - prazo_relativo
    trecho: I - suspensos os prazos; e
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art39_par13
    tipos:
    - prazo_relativo
    trecho: § 13. Caso o procedimento de fiscalização não seja encerrado no prazo de que trata o § 12, o crédito será ressarcido ao contribuinte nos quinze dias subsequentes.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art39_par15
    tipos:
    - a_partir_de_ate
    trecho: § 15. O valor dos saldos credores cujo ressarcimento tenha sido solicitado nos termos deste artigo será corrigido, caso o pagamento ocorra a partir do primeiro dia do segundo mês seguinte ao do pedido, pela taxa Selic acumulada mensalmente a partir desta data até o mês anterior ao pagamento, acrescido de 1% (um por cento) no mês de pagamento.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art39_par16
    tipos:
    - prazo_relativo
    trecho: '§ 16. Os prazos de que trata o § 9º serão suspensos, por até cinco anos, contados da data da opção, não aplicado o disposto no § 15, caso o contribuinte realize a opção:'
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art39_par17
    tipos:
    - a_partir_de_ate
    - prazo_relativo
    trecho: § 17. Na hipótese de descumprimento dos prazos previstos nos § 9º a § 11, o valor do saldo credor será corrigido diariamente pela taxa Selic a partir do primeiro dia do início do prazo para apreciação do pedido até o dia anterior ao do ressarcimento.
