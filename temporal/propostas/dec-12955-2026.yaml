  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art425_incIII_ali-e
    tipos:
    - ano
    trecho: e) 1,2% (um inteiro e dois décimos por cento) em 2032; e
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art425_incIII_ali-f
    tipos:
    - ano
    trecho: f) 1% (um por cento) de 2033 em diante.
