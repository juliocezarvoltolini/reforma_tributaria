    trecho: § 1º Os documentos fiscais serão considerados na apuração da devolução personalizada somente a partir do mês subsequente ao da inclusão ou reativação do beneficiário na sistemática de devoluções referida no art. 493, de modo a permitir a devida atualização cadastral, não havendo acúmulo de devolução no próprio mês-calendário da inclusão ou reativação (Art. 113 da Lei Complementar nº 214, de 16 de janeiro de 2025)
