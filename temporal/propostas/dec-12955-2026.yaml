    trecho: Art. 463. O contribuinte que realizar locação, cessão onerosa ou arrendamento de bem imóvel decorrente de contratos firmados por prazo determinado poderá optar, de forma irretratável, pelo recolhimento de CBS com base na receita bruta recebida. (Art. 487, Lei Complementar nº 214, de 16 de janeiro de 2025)
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art463_par1_incI
    tipos:
    - prazo_relativo
    trecho: 'I - para contrato com finalidade não residencial, pelo prazo original do contrato, desde que este:'
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art463_par1_incI_ali-a
    tipos:
