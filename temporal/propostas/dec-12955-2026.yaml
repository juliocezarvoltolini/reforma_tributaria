  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art518_par3_incII_ali-d
    tipos:
    - prazo_relativo
    trecho: d) à manutenção da produção por prazo mínimo, inclusive após o encerramento do benefício; e
