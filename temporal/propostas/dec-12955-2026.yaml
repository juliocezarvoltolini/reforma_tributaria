  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art314_par1
    tipos:
    - prazo_relativo
    trecho: § 1º A base de cálculo da CBS corresponderá ao desconto aplicado na liquidação antecipada, com a dedução de valor correspondente à curva de juros futuros da taxa DI, pelo prazo da antecipação, nos termos do § 2º.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art314_par3
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: § 3º Poderão ser deduzidas da base de cálculo referida no § 1º as perdas incorridas no recebimento de créditos e as perdas na cessão desses créditos e na concessão de descontos, desde que sejam realizados a valor de mercado, obedecidas, ainda, em todos os casos, as mesmas regras de dedutibilidade da legislação do imposto de renda aplicáveis a essas perdas para os períodos de apuração iniciados a partir de 1º de janeiro de 2027.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art314_par6
    tipos:
    - prazo_relativo
    trecho: § 6º O tomador dos serviços de liquidação antecipada de recebíveis de arranjos de pagamento que for contribuinte da CBS sujeito ao regime regular poderá creditar-se da CBS nessas operações, em relação à parcela do desconto aplicado, no momento da liquidação antecipada, pelo regime de caixa, que for superior à curva de juros futuros da taxa DI, pelo prazo da antecipação.
