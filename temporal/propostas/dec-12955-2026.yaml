  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art581_par2
    tipos:
    - prazo_relativo
    trecho: § 2º Na hipótese de o recurso ser considerado improcedente, o prestador de serviço de pagamento ou a instituição operadora do sistema de pagamento tem o prazo de até vinte dias úteis, contado da decisão, para efetuar o recolhimento das multas previstas no art. 579 deste Regulamento.
