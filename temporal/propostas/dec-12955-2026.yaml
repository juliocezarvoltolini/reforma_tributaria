  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art441
    tipos:
    - ano
    - data_explicita
    trecho: Art. 441. O regime de destinação integral do produto da arrecadação da CBS e do IBS ao ente federativo contratante de que tratam os art. 439 e art. 440 não se aplica em relação aos fatos geradores ocorridos de 1º de janeiro a 31 de dezembro de 2026. (Art. 372 da Lei Complementar nº 214, de 16 de janeiro de 2025)
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art441_par1
    tipos:
    - ano
    - data_explicita
    trecho: § 1º Não se aplica o regime da destinação integral do produto da arrecadação da CBS nas aquisições efetuadas pela administração pública direta de Estados e Municípios, bem como por suas autarquias e fundações públicas, em relação aos fatos geradores ocorridos de 1º de janeiro de 2027 a 31 de dezembro de 2028.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art441_par2_incI
    tipos:
    - ano
    - data_explicita
    trecho: I - de 1º de janeiro a 31 de dezembro de 2029, 10% (dez por cento);
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art441_par2_incII
    tipos:
    - ano
    - data_explicita
    trecho: II - de 1º de janeiro a 31 de dezembro de 2030, 20% (vinte por cento);
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art441_par2_incIII
    tipos:
    - ano
    - data_explicita
    trecho: III - de 1º de janeiro a 31 de dezembro de 2031, 30% (trinta por cento); e
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art441_par2_incIV
    tipos:
    - ano
    - data_explicita
    trecho: IV - de 1º de janeiro a 31 de dezembro de 2032, 40% (quarenta por cento).
