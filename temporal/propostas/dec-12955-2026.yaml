    tipos:
    - prazo_relativo
    trecho: Art. 581. O prestador de serviço de pagamento ou a instituição operadora do sistema de pagamento poderá impugnar, mediante processo administrativo específico a ser disciplinado pela RFB, a penalidade aplicada, no prazo de até vinte dias úteis, contado da notificação da infração, em petição dirigida à RFB. (Art. 471-F da Lei Complementar nº 214, de 16 de janeiro de 2025)
