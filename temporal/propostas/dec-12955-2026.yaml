    tipos:
    - prazo_relativo
    trecho: III - não comunicar à administração tributária a venda ou a transferência de estabelecimento e o encerramento ou a paralisação temporária de atividades, na forma e nos prazos estabelecidos na legislação tributária - dez UPF por infração;
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art577_incIV
    tipos:
    - prazo_relativo
    trecho: 'IV - entregar em atraso, deixar de entregar, de registrar, de disponibilizar ou de manter, ou manter, registrar ou entregar em desacordo com a legislação tributária, inclusive com relação ao descumprimento de prazo fixado em intimação fiscal, arquivos eletrônicos decorrentes da emissão de documentos fiscais ou de sua escrituração, documento informativo do movimento econômico ou fiscal, declarações periódicas ou outras informações previstas na legislação necessárias à escrituração ou à apuração do tributo:'
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art577_incVIII
    tipos:
    - prazo_relativo
    trecho: VIII - deixar de comunicar ou comunicar após o prazo previsto na legislação tributária a inutilização de número de documento fiscal - uma UPF por número;
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art577_incXVI
    tipos:
    - prazo_relativo
    trecho: XVI - deixar de emitir documento fiscal referente a aquisição ou entrada de bem ou a aquisição de serviço, no prazo e nas hipóteses previstos na legislação tributária - 100% (cem por cento) do valor do tributo de referência;
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art577_incXVII_ali-b
    tipos:
    - prazo_relativo
    trecho: b) após o prazo para cancelamento de documento fiscal previsto na legislação tributária - 33% (trinta e três por cento) do valor do tributo de referência;
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art577_par5_incI
    tipos:
    - ano
    trecho: I - em 2026, a 6% (seis por cento) do valor da operação; e
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art577_par5_incII
    tipos:
    - ano
    - a_partir_de_ate
    trecho: II - a partir de 2027, para a CBS, à multiplicação da alíquota de referência pelo valor da operação, ainda que se trate de operação imune, isenta, sujeita a alíquota zero, alíquota reduzida ou base de cálculo reduzida, alcançada por diferimento ou suspensão.
