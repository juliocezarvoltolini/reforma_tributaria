  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art375_incI
    tipos:
    - ano
    - data_explicita
    trecho: 'I - no caso de bens imóveis de propriedade do contribuinte em 31 de dezembro de 2026:'
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art375_incII
    tipos:
    - ano
    - data_explicita
    trecho: 'II - no caso de bens imóveis em construção em 31 de dezembro de 2026, à soma:'
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art375_incII_ali-b
    tipos:
    - ano
    - data_explicita
    trecho: b) do valor dos bens e serviços que possam ser contabilizados como custo de produção do bem imóvel ou como despesa direta relacionada à produção ou comercialização do bem imóvel adquiridos anteriormente a 1º de janeiro de 2027, comprovado com base em documentos fiscais idôneos, atualizado nos termos do § 4º;
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art375_incIII
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: III - no caso de bens imóveis adquiridos de não contribuinte do regime regular da CBS a partir de 1º de janeiro de 2027, ao valor de aquisição do bem imóvel.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art375_par1_incI
    tipos:
    - ano
    - data_explicita
    trecho: I - no caso dos incisos I e II do caput, 31 de dezembro de 2026; e
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art375_par2
    tipos:
    - ano
    - data_explicita
    trecho: § 2º Caso o valor de referência do imóvel não esteja disponível em 31 de dezembro de 2026, o contribuinte que não optar pela fixação do redutor de ajuste na forma do inciso I do caput poderá calculá-lo com base em estimativa de valor de mercado do bem imóvel realizada por meio de procedimento específico, nos termos de ato conjunto da RFB e do CGIBS.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art375_par4_incI
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: I - até 31 de dezembro de 1979, pelo Índice de Preços ao Consumidor (IPC) da Fundação Instituto de Pesquisas Econômicas (Fipe); e
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art375_par4_incII
    tipos:
    - ano
    - data_explicita
    trecho: II - entre 1º de janeiro de 1980 e 31 de dezembro de 2026, pelo IPCA ou por outro índice que vier a substituí-lo.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art375_par5_incI
    tipos:
    - prazo_relativo
    trecho: I - a alienação ocorra em prazo inferior a três anos, contados da data de aquisição do imóvel;
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art375_par10
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: § 10. No caso de bens imóveis adquiridos de contribuinte sujeito ao regime regular da CBS a partir de 1º de janeiro de 2027, é assegurada a manutenção do valor do redutor de ajuste, nos termos do art. 371, caput, inciso I, sem prejuízo do direito ao crédito da CBS incidente na operação.
