  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art445_par1
    tipos:
    - prazo_relativo
    trecho: '§ 1º Elaborada a proposta de solução de consulta, o órgão consultado disponibilizará em ambiente virtual compartilhado a minuta para ser avaliada pelo outro órgão, o qual poderá, no prazo de trinta dias contado da disponibilização, prorrogável, justificadamente, uma única vez, por igual período:'
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art445_par2
    tipos:
    - condicao_ate_que
    trecho: § 2º O encaminhamento da proposta de solução para deliberação do Comitê de Harmonização das Administrações Tributárias suspenderá a tramitação do procedimento de consulta perante o órgão consultado até que seja editada resolução nos termos do art. 456, § 1º (Art. 321, § 1º, da Lei Complementar nº 214, de 16 de janeiro de 2025).
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art445_par3
    tipos:
    - prazo_relativo
    trecho: § 3º Transcorrido o prazo de que trata o § 1º sem manifestação do outro órgão, considerar-se-á tacitamente aceita a minuta compartilhada e será publicada solução de consulta mediante ato conjunto da RFB e do CGIBS, com a informação de aceitação tácita por um dos órgãos.
