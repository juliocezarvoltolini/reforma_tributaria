    tipos:
    - produz_efeitos
    trecho: § 3º No caso de opção pelo regime no início de atividade, a opção de que trata o caput será simultânea à solicitação do registro no cadastro com identificação única de que trata o Capítulo I do Título II deste Livro e produzirá efeitos a partir da data do registro.
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art393_par5
    tipos:
    - prazo_relativo
    trecho: § 5º Alterações na listagem de que trata o § 4º deverão ser comunicadas, observados a forma e o prazo definidos em ato conjunto da RFB e do CGIBS.
