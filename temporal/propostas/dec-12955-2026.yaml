    - data_explicita
    - a_partir_de_ate
    trecho: a) seja firmado até 16 de janeiro de 2025, sendo a data comprovada por firma reconhecida ou por meio de assinatura eletrônica; e
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art463_par1_incI_ali-b
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: 'b) seja registrado em Cartório de Registro de Imóveis ou em Registro de Títulos e Documentos, até 31 de dezembro de 2025, ou disponibilizado para a RFB e para o CGIBS, nos seguintes termos:'
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art463_par1_incI_ali-b
    tipos:
    - prazo_relativo
    trecho: 3. o contribuinte que optar pelo regime a que se refere este artigo declara, automaticamente, estar ciente de todas as condições para sua fruição e se compromete com a guarda do contrato pelo prazo prescricional; e
  - urn: urn:lex:br:federal:decreto:2026-04-29;12955!art463_par1_incII
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    - prazo_relativo
