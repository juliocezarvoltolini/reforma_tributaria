    trecho: § 1º A opção de que trata o caput será formalizada no período compreendido entre o primeiro dia de setembro e o último dia do mês de outubro do ano anterior e produzirá efeitos a partir do primeiro dia do ano-calendário seguinte ao da opção, ressalvado o disposto no § 3º.
