  - urn: urn:lex:br:federal:lei.complementar:2026-08-27;235!art5
    tipos:
    - evento_publicacao
    trecho: Art. 5º As pessoas jurídicas produtoras de etanol poderão utilizar os saldos credores da Contribuição para o PIS/Pasep e da Cofins, apurados até a data de publicação desta Lei Complementar, na forma do art. 3º da Lei nº 10.637, de 30 de dezembro de 2002, do art. 3º da Lei nº 10.833, de 29 de dezembro de 2003, e do art. 8º da Lei nº 10.925, de 23 de julho de 2004, para compensação com débitos próprios, vencidos ou vincendos, relativos a tributos e contribuições administrados pela Secretaria Especial da Receita Federal do Brasil.
  - urn: urn:lex:br:federal:lei.complementar:2026-08-27;235!art5_par1
    tipos:
    - ano
    trecho: § 1º O saldo credor compensável na forma deste artigo está limitado ao montante global de R$ 750.000.000,00 (setecentos e cinquenta milhões de reais) no ano de 2026.
  - urn: urn:lex:br:federal:lei.complementar:2026-08-27;235!art5_par3
    tipos:
    - prazo_relativo
    trecho: § 3º A Secretaria Especial da Receita Federal do Brasil terá o prazo de 15 (quinze) dias corridos, contado da publicação desta Lei Complementar, para regulamentar os procedimentos e prazos.
  - urn: urn:lex:br:federal:lei.complementar:2026-08-27;235!art5_par6
    tipos:
    - ano
    trecho: § 6º Caso o valor dos créditos apresentados por todas as produtoras de etanol seja superior ao valor previsto no § 1º deste artigo, a Secretaria Especial da Receita Federal do Brasil repartirá a totalidade do valor previsto de forma proporcional ao percentual de produção de etanol hidratado, no ano-calendário de 2025, de cada contribuinte habilitado, conforme dados fornecidos pela Agência Nacional do Petróleo, Gás Natural e Biocombustíveis (ANP).
  - urn: urn:lex:br:federal:lei.complementar:2026-08-27;235!art5_par7
    tipos:
    - ano
    - a_partir_de_ate
    - prazo_relativo
    trecho: § 7º A partir do ano de 2027, os créditos apurados na forma do caput deste artigo, que sejam atualmente objeto de limitação de ressarcimento, serão passíveis de compensação com débitos da Contribuição Social sobre Bens e Serviços, na forma do inciso III do art. 378 da Lei Complementar nº 214, de 16 de janeiro de 2025, mantida a fluência do prazo para a sua utilização.
  - urn: urn:lex:br:federal:lei.complementar:2026-08-27;235!art5_par9
    tipos:
    - ano
    trecho: § 9º Na hipótese de não ser possível a apresentação das compensações no ano de 2026, o contribuinte poderá compensar com débitos próprios, vencidos ou vincendos, relativos a tributos e contribuições administrados pela Secretaria Especial da Receita Federal do Brasil no ano de 2027.
