    trecho: Art. 4º Na hipótese de implementação de políticas de subvenção ou de ressarcimento a agentes econômicos do setor de combustíveis, é assegurado ao agente econômico participante o direito ao recebimento integral dos valores devidos no prazo máximo de 30 (trinta) dias, contado da apresentação da respectiva comprovação.
  - urn: urn:lex:br:federal:lei.complementar:2026-08-27;235!art4_par1
    tipos:
    - a_partir_de_ate
    - prazo_relativo
    trecho: § 1º O não atendimento do prazo previsto no caput deste artigo enseja o pagamento dos valores com acréscimo de juros equivalentes à taxa Selic, incidente a partir do primeiro dia após o fim do referido prazo.
  - urn: urn:lex:br:federal:lei.complementar:2026-08-27;235!art4_par2
    tipos:
    - prazo_relativo
    trecho: § 2º O inadimplemento do valor devido no prazo previsto no caput deste artigo assegura ao agente econômico o reconhecimento do correspondente crédito perante a União, passível de utilização econômica na forma de regulamentação, inclusive mediante compensação, abatimento ou liquidação de obrigações.
