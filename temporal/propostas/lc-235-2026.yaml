  - urn: urn:lex:br:federal:lei.complementar:2026-08-27;235!art2
    tipos:
    - ano
    trecho: Art. 2º Em caráter extraordinário, no exercício financeiro de 2026, as renúncias de receita decorrentes de atos do Poder Executivo federal que tenham como objetivo mitigar os impactos econômicos causados pelo choque no mercado internacional de energia decorrentes do conflito no Oriente Médio poderão ser compensadas por meio do aumento extraordinário de receita da União, direta ou indiretamente decorrente do referido choque, hipótese em que será considerado atendido o disposto no art. 14 da Lei Complementar nº 101, de 4 de maio de 2000 (Lei de Responsabilidade Fiscal).
  - urn: urn:lex:br:federal:lei.complementar:2026-08-27;235!art2_par7
    tipos:
    - ano
    - data_explicita
    trecho: § 7º Em caráter extraordinário, o Poder Executivo federal concederá subvenção aos produtores e às cooperativas de produtores de etanol hidratado, limitada ao valor total de R$ 1.200.000.000,00 (um bilhão e duzentos milhões de reais), com o objetivo de assegurar a manutenção da diferenciação competitiva de que trata o § 3º durante a vigência da subvenção concedida à gasolina A no período de 25 de maio de 2026 a 11 de agosto de 2026.
  - urn: urn:lex:br:federal:lei.complementar:2026-08-27;235!art2_par8
    tipos:
    - prazo_relativo
    trecho: § 8º A subvenção concedida aos produtores ou cooperativas de produtores de etanol deverá levar em consideração a produção de etanol hidratado efetivamente comercializada no período, nos termos de regulamento, que também definirá as formas de habilitação, as regras e os procedimentos de operacionalização, a apuração e a verificação dos valores, os prazos e a sistemática de pagamento das subvenções econômicas ao etanol hidratado previstas neste artigo.
