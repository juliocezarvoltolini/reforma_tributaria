norma: lc-235-2026
urn_norma: urn:lex:br:federal:lei.complementar:2026-08-27;235
titulo: Lei Complementar nº 235, de 27 de agosto de 2026
gerado_por: pipeline/propor_vigencia.py
status: proposta
aviso: 'PROPOSTA MECÂNICA, NÃO APLICADA. Nada em /normas/ foi alterado. Cada dispositivo exige decisão humana em `revisao`. O script só interpreta padrões exatos; o resto está marcado como não interpretado. Vigência não é eficácia: os marcos próprios de cada artigo estão em `marcos_proprios`, em trecho literal.'
fonte_sha256: 67061ca3bf35de12d41367bbc4b3a12d9a0c1ccefe789bdff5744b23a91e3eef
instrucoes_revisao: 'Primeiro rode pipeline/revisar_por_regra.py: ele decide o que a cláusula diz literalmente (revisado_por: regra:...) e deixa o resto em branco. Em cada dispositivo sem decisão, preencha `revisao`. escopo: [vigencia], [efeitos] ou os dois (padrão) diz quais eixos a decisão cobre; o eixo de fora continua provisório. decisao: aceitar adota as propostas dos eixos do escopo, e só vale se cada um tiver proposta com data. decisao: alterar exige, para os eixos do escopo, vigencia_inicio/efeitos_inicio e fundamento_vigencia/fundamento_efeitos (listas de URN); opcionais: vigencia_fim, efeitos_fim, precisao ({campo: ano}, com a data em AAAA-01-01) e excecoes_subdivisao (urn de § ou inciso do próprio artigo, as datas que diferem e fundamento). decisao: rejeitar mantém o dispositivo pendente. Toda decisão exige revisado_por e revisado_em; a decisão humana prevalece e nunca é refeita por regra. Depois, rode pipeline/fatiar.py: é ele que aplica a revisão a normas/. Se o original mudar
  (sha256), a revisão deixa de ser aplicada e precisa ser refeita.'
