  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art9
    tipos:
    - depende_de_lei_futura
    trecho: Art. 9º A lei complementar que instituir o imposto de que trata o art. 156-A e a contribuição de que trata o art. 195, V, ambos da Constituição Federal, poderá prever os regimes diferenciados de tributação de que trata este artigo, desde que sejam uniformes em todo o território nacional e sejam realizados os respectivos ajustes nas alíquotas de referência com vistas a reequilibrar a arrecadação da esfera federativa.
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art9_par1
    tipos:
    - depende_de_lei_futura
    trecho: '§ 1º A lei complementar definirá as operações beneficiadas com redução de 60% (sessenta por cento) das alíquotas dos tributos de que trata o caput entre as relativas aos seguintes bens e serviços:'
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art9_par3_incII_ali-d
    tipos:
    - depende_de_lei_futura
    trecho: d) automóveis de passageiros, conforme critérios e requisitos estabelecidos em lei complementar, quando adquiridos por pessoas com deficiência e pessoas com transtorno do espectro autista, diretamente ou por intermédio de seu representante legal ou por motoristas profissionais, nos termos de lei complementar, que destinem o automóvel à utilização na categoria de aluguel (táxi);
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art9_par4
    tipos:
    - ano
    - data_explicita
    trecho: § 4º O produtor rural pessoa física ou jurídica que obtiver receita anual inferior a R$ 3.600.000,00 (três milhões e seiscentos mil reais), atualizada anualmente pelo Índice Nacional de Preços ao Consumidor Amplo (IPCA), e o produtor integrado de que trata o art. 2º, II, da Lei nº 13.288, de 16 de maio de 2016, com a redação vigente em 31 de maio de 2023, poderão optar por ser contribuintes dos tributos de que trata o caput.
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art9_par5
    tipos:
    - depende_de_lei_futura
    trecho: '§ 5º É autorizada a concessão de crédito ao contribuinte adquirente de bens e serviços de produtor rural pessoa física ou jurídica que não opte por ser contribuinte na hipótese de que trata o § 4º, nos termos da lei complementar, observado o seguinte:'
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art9_par6_incI
    tipos:
    - depende_de_lei_futura
    trecho: I - serviços de transportador autônomo de carga pessoa física que não seja contribuinte do imposto, nos termos da lei complementar;
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art9_par7
    tipos:
    - depende_de_lei_futura
    trecho: § 7º Lei complementar poderá prever a concessão de crédito ao contribuinte que adquira bens móveis usados de pessoa física não contribuinte para revenda, desde que esta seja tributada e o crédito seja vinculado ao respectivo bem, vedado o ressarcimento.
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art9_par10
    tipos:
    - prazo_relativo
    trecho: § 10. Os regimes diferenciados de que trata este artigo serão submetidos a avaliação quinquenal de custo-benefício, podendo a lei fixar regime de transição para a alíquota padrão, não observado o disposto no § 2º, garantidos os respectivos ajustes nas alíquotas de referência.
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art9_par12
    tipos:
    - depende_de_lei_futura
    trecho: § 12. A lei complementar estabelecerá as operações beneficiadas com redução de 30% (trinta por cento) das alíquotas dos tributos de que trata o caput relativas à prestação de serviços de profissão intelectual, de natureza científica, literária ou artística, desde que sejam submetidas a fiscalização por conselho profissional.
