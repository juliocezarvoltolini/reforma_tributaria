    tipos:
    - prazo_relativo
    trecho: § 3º Para efeitos deste artigo, consideram-se benefícios onerosos as isenções, os incentivos e os benefícios fiscais ou financeiro-fiscais vinculados ao imposto referido no caput deste artigo concedidos por prazo certo e sob condição, na forma do art. 178 da Lei nº 5.172, de 25 de outubro de 1966 (Código Tributário Nacional).
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art12_par4_incI
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    - prazo_relativo
    trecho: I - aplica-se aos titulares de benefícios onerosos referentes ao imposto previsto no art. 155, II, da Constituição Federal regularmente concedidos até 31 de maio de 2023, sem prejuízo de ulteriores prorrogações ou renovações, observados o prazo estabelecido no caput e, se aplicável, a exigência de registro e depósito estabelecida pelo art. 3º, II, da Lei Complementar nº 160, de 7 de agosto de 2017, que tenham cumprido tempestivamente as condições exigidas pela norma concessiva do benefício, bem como aos titulares de projetos abrangidos pelos benefícios a que se refere o art. 19 desta Emenda Constitucional;
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art12_par6
    tipos:
    - depende_de_lei_futura
    trecho: '§ 6º Lei complementar estabelecerá:'
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art12_par7
    tipos:
    - prazo_relativo
    trecho: § 7º É vedada a prorrogação dos prazos de que trata o art. 3º, §§ 2º e 2º-A, da Lei Complementar nº 160, de 7 de agosto de 2017.
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art12_par9
    tipos:
    - ano
    - data_explicita
    trecho: § 9º Eventual saldo financeiro existente em 31 de dezembro de 2032 será transferido ao Fundo de que trata o art. 159-A da Constituição Federal, com a redação dada pelo art. 1º desta Emenda Constitucional, sem redução ou compensação dos valores consignados no art. 13 desta Emenda Constitucional.
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art12_par10
    tipos:
    - ano
    - data_explicita
    - evento_promulgacao
    trecho: § 10. O disposto no § 4º, I, aplica-se também aos titulares de benefícios onerosos que, por força de mudanças na legislação estadual, tenham migrado para outros programas ou benefícios entre 31 de maio de 2023 e a data de promulgação desta Emenda Constitucional, ou estejam em processo de migração na data de promulgação desta Emenda Constitucional.
