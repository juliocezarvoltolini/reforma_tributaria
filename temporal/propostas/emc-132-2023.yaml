    trecho: Art. 12.Fica instituído o Fundo de Compensação de Benefícios Fiscais ou Financeiro-Fiscais do imposto de que trata o art. 155, II, da Constituição Federal, com vistas a compensar, entre 1º de janeiro de 2029 e 31 de dezembro de 2032, pessoas físicas ou jurídicas beneficiárias de isenções, incentivos e benefícios fiscais ou financeiro-fiscais relativos àquele imposto, concedidos por prazo certo e sob condição.
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art12_par1
    tipos:
    - ano
    trecho: '§ 1º De 2025 a 2032, a União entregará ao Fundo recursos que corresponderão aos seguintes valores, atualizados, de 2023 até o ano anterior ao da entrega, pela variação acumulada do IPCA ou de outro índice que vier a substituí-lo:'
