decisoes_necessarias:
- id: ano_sem_dia
  pergunta: Quando a cláusula diz 'em <ano>', o campo vigencia_inicio exige uma data completa. A proposta usa 1º de janeiro como candidata, por convenção e não por texto. Aceitar a convenção, fixar outra data, ou ampliar o modelo para aceitar ano?
- id: publicacao_x_data_do_ato
  pergunta: 'O pipeline grava como `publicacao` a data do ato (2023-12-20), e é dela que partem vigencia_inicio e efeitos_inicio provisórios. A cláusula ''na data de sua publicação'' refere-se à publicação no DOU, que o rodapé do compilado informa ser 2023-12-21 (data do ato lida do original: 2023-12-20). Separar `data_do_ato` de `publicacao` no modelo?'
- id: datas_por_subdivisao
  pergunta: Vários artigos têm marcos temporais por subdivisão (incisos e parágrafos). O front-matter guarda um par vigência/efeitos por artigo. Registrar por subdivisão, ou manter por artigo e remeter ao texto?
- id: norma_alterada_nao_ingerida
  pergunta: Os artigos 1, 2, 3, 4, 5 inserem texto em outra norma (Constituição e/ou ADCT), que não está ingerida. A vigência do artigo desta norma é a da cláusula; quando o texto inserido produz efeitos depende do próprio texto inserido. Ingerir a norma alterada, ou registrar a pendência em /lacunas/?
- id: depende_de_lei_futura
  pergunta: 'Há artigos que dependem de lei futura: transitórios (''Até que lei complementar...'') ou que remetem a ela (''Lei complementar definirá...''). Se a lei foi editada, o efeito muda, mas verificar isso é interpretação (camada 3) e exige a norma regulamentadora. Registrar como pendente em /lacunas/ até lá? O rótulo `depende_de_lei_futura` tem cobertura parcial: sua ausência não prova que não há dependência.'
