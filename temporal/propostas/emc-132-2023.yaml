    - data_explicita
    - a_partir_de_ate
    trecho: Art. 19. Os projetos habilitados à fruição dos benefícios estabelecidos pelo art. 11-C da Lei nº 9.440, de 14 de março de 1997, e pelos arts. 1º a 4º da Lei nº 9.826, de 23 de agosto de 1999, farão jus, até 31 de dezembro de 2032, a crédito presumido da contribuição prevista no art. 195, V, da Constituição Federal.
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art19_par1_incII_ali-a
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    - evento_promulgacao
    trecho: a) a projetos aprovados até 31 de dezembro de 2024 de pessoas jurídicas habilitadas à fruição dos benefícios estabelecidos pelo art. 11-C da Lei nº 9.440, de 14 de março de 1997, e pelos arts. 1º a 4º da Lei nº 9.826, de 23 de agosto de 1999, na data de promulgação desta Emenda Constitucional;
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art19_par1_incII_ali-b
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: b) a novos projetos, aprovados até 31 de dezembro de 2025, que ampliem ou reiniciem a produção em planta industrial utilizada em projetos ativos ou inativos habilitados à fruição dos benefícios de que trata a alínea "a"deste inciso;
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art19_par1_incIV
    tipos:
    - ano
    trecho: IV - equivalerá ao nível de benefício estabelecido, para o ano de 2025, pelo art. 11-C da Lei nº 9.440, de 14 de março de 1997, e pelos arts. 1º a 4º da Lei nº 9.826, de 23 de agosto de 1999; e
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art19_par1_incV
    tipos:
    - ano
    trecho: V - será reduzido à razão de 20% (vinte por cento) ao ano entre 2029 e 2032.
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art19_par3_incI
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: I - no caso de montadoras de veículos, inicie a produção de veículos que atendam ao disposto no § 1º, I, até 1º de janeiro de 2028; e
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art19_par3_incII_ali-c
    tipos:
    - prazo_relativo
    trecho: c) à manutenção da produção por prazo mínimo, inclusive após o encerramento do benefício.
  - urn: urn:lex:br:federal:emenda.constitucional:2023-12-20;132!art19_par4
    tipos:
    - depende_de_lei_futura
    trecho: § 4º A lei complementar estabelecerá as penalidades aplicáveis em razão do descumprimento das condições exigidas para fruição do crédito presumido de que trata este artigo.
