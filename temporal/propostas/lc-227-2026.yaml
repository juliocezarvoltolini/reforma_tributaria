  marcos_proprios:
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art129
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: Art. 129. O percentual da receita do IBS dos Estados, do Distrito Federal e dos Municípios destinado ao financiamento do Fundo de Combate à Pobreza de que trata o art. 82 do ADCT poderá ser estabelecido por lei específica do respectivo ente federativo, observado o limite superior de 1% (um por cento), para vigência a partir de 1º de janeiro de 2033.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art129_par1
    tipos:
    - evento_publicacao
    trecho: '§ 1º Em relação ao ente federativo que, na data de publicação da Emenda Constitucional nº 132, de 20 de dezembro de 2023, já possuía o Fundo de Combate à Pobreza de que trata o art. 82 do ADCT, será apurada:'
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art129_par1_incI
    tipos:
    - ano
    trecho: I - para cada Estado, a relação percentual entre a receita média auferida com o adicional de alíquotas previsto no § 1º do art. 82 do ADCT e a receita bruta média do ICMS, considerando para ambas o período de 2019 a 2026;
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art129_par1_incII
    tipos:
    - ano
    trecho: II - para o Distrito Federal, a relação percentual entre a receita média auferida com os adicionais de alíquotas previstos nos §§ 1º e 2º do art. 82 do ADCT e a receita bruta média dos impostos previstos no inciso II do caput do art. 155 e no inciso III do caput do art. 156 da Constituição Federal, considerando para ambas o período de 2019 a 2026;
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art129_par1_incIII
    tipos:
    - ano
    trecho: III - para cada Município, a relação percentual entre a receita média auferida com o adicional de alíquotas previsto no § 2º do art. 82 do ADCT e a receita bruta média do imposto previsto no inciso III do caput do art. 156 da Constituição Federal, considerando para ambas o período de 2019 a 2026.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art129_par2_incI
    tipos:
    - ano
    trecho: I - 3/4 (três quartos) da relação percentual apurada na forma do § 1º deste artigo no período de 2033 a 2040;
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art129_par2_incII
    tipos:
    - ano
    trecho: II - metade da relação percentual apurada na forma do § 1º deste artigo no período de 2041 a 2048;
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art129_par2_incIII
    tipos:
    - ano
    trecho: III - 1/4 (um quarto) da relação percentual apurada na forma do § 1º deste artigo no período de 2049 a 2056;
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art129_par2_incIV
    tipos:
    - ano
    - a_partir_de_ate
    trecho: IV - 1% (um por cento) a partir de 2057.
