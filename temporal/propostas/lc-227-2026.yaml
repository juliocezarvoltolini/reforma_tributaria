    trecho: § 4º A ausência de manifestação do Poder Legislativo nos prazos estabelecidos neste artigo é considerada como aprovação tácita das propostas de que tratam os incisos I e II do caput deste artigo.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art47_par8
    tipos:
    - prazo_relativo
    trecho: § 8º Na ocorrência da hipótese prevista no § 5º deste artigo, o Conselho Superior do CGIBS publicará no Diário Oficial da União nova proposta a que se refere o inciso II do caput deste artigo em até 30 (trinta) dias após a rejeição do orçamento.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art47_par9
    tipos:
    - prazo_relativo
    trecho: § 9º Em caso de nova proposta, o prazo previsto no § 2º deste artigo será de 15 (quinze) dias.
