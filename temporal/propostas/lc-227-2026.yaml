    - ano
    trecho: c) 0,67% (sessenta e sete centésimos por cento) no exercício financeiro de 2031; e
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art51_incII_ali-d
    tipos:
    - ano
    trecho: d) 0,5% (cinco décimos por cento) no exercício financeiro de 2032.
