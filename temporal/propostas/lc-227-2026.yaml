    tipos:
    - prazo_relativo
    trecho: '§ 2º No prazo de 30 (trinta) dias, contado da publicação no Diário Oficial da União da proposta de orçamento a que se refere o inciso II do caput deste artigo, os Poderes Legislativos dos entes federativos de origem dos membros titulares do Conselho Superior do CGIBS deverão manifestar-se, comunicando ao CGIBS, sobre a aprovação ou a rejeição das propostas:'
