  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art143_par1
    tipos:
    - ano
    - data_explicita
    trecho: § 1º Se não for possível estabelecer correspondência entre a mercadoria em estoque e seu recebimento, a apuração do montante a que se refere o caput deste artigo será efetuada com base no valor retido do ICMS, correspondente à média das entradas dos últimos 3 (três) meses, até o limite da quantidade informada no inventário realizado em 31 de dezembro de 2032.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art143_par2
    tipos:
    - ano
    - data_explicita
    trecho: § 2º Para os efeitos do disposto neste artigo, também se considera em estoque a mercadoria cuja saída do estabelecimento remetente tenha ocorrido até o dia 31 de dezembro de 2032 e cuja entrada no estabelecimento destinatário ocorra após essa data, desde que o ICMS tenha sido retido ou recolhido por substituição tributária.
