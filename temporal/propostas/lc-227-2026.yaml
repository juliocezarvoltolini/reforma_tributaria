    tipos:
    - prazo_relativo
    trecho: § 1º O ressarcimento de que trata o caput deste artigo será efetuado em até 90 (noventa) dias após o encerramento do mês em que ocorreria a respectiva compensação, vedada a incidência de acréscimos de qualquer natureza.
