  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art117
    tipos:
    - ano
    - data_explicita
    trecho: 'Art. 117. De 1º de janeiro de 2029 a 31 de dezembro de 2096, o valor retido nos termos do art. 110 desta Lei Complementar será distribuído mensalmente aos Estados, ao Distrito Federal ou aos Municípios com as menores razões entre:'
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art117_par2
    tipos:
    - ano
    trecho: '§ 2º De 2029 a 2033, para fins do cálculo da média da receita do IBS a que se refere o inciso I do caput deste artigo, os valores da receita relativos a meses do ano-calendário anterior serão multiplicados pela razão entre:'
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art117_par2_incII
    tipos:
    - ano
    trecho: II - a alíquota de referência do ano anterior da respectiva esfera da Federação, considerando-se, para o ano de 2028, a alíquota de 0,05% (cinco centésimos por cento).
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art117_par3_incII_ali-a
    tipos:
    - ano
    trecho: a) a receita média de referência do conjunto dos Estados dividida pela média da população do conjunto dos Estados entre 2019 e 2026; e
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art117_par3_incII_ali-b
    tipos:
    - ano
    trecho: b) a média da população do Estado entre 2019 e 2026.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art117_par4_incII_ali-a
    tipos:
    - ano
    trecho: a) a receita média de referência do conjunto dos Municípios dividida pela média da população do conjunto dos Municípios entre 2019 e 2026; e
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art117_par4_incII_ali-b
    tipos:
    - ano
    trecho: b) a média da população do Município entre 2019 e 2026.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art117_par6_incII_ali-b
    tipos:
    - ano
    trecho: b) o número médio de habitantes do Distrito Federal entre 2019 e 2026.
