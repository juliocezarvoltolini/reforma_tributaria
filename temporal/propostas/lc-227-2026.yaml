    trecho: a) serão considerados os valores anuais de 2021 a 2023; e
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art115_par3_incII_ali-b
    tipos:
    - ano
    - a_partir_de_ate
    trecho: 1. do respectivo ano até 2023, pela variação nominal da arrecadação do respectivo Estado com o ICMS; e
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art115_par3_incII_ali-b
    tipos:
    - ano
    trecho: 2. de 2023 a 2026, pela variação nominal da arrecadação total dos Estados, do Distrito Federal e dos Municípios com os impostos a que se referem o inciso II do caput do art. 155 e o inciso III do caput do art. 156 da Constituição Federal.
