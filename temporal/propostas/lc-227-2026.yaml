    - data_explicita
    - prazo_relativo
    trecho: I - o interessado deverá protocolar o pedido no prazo máximo de 5 (cinco) anos, contado do dia 1º de janeiro de 2033; e
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art134_incII
    tipos:
    - prazo_relativo
    trecho: II - o Estado ou o Distrito Federal deverá pronunciar-se no prazo máximo de 24 (vinte e quatro) meses, contado da data do respectivo protocolo.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art134_par1_incI
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: I - o pedido previsto no inciso I do caput deste artigo deverá ser protocolado no mesmo período de apuração em que tiver início o aproveitamento do crédito, na hipótese de bem cuja entrada no estabelecimento ocorra a partir de 1º de janeiro de 2029; e
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art134_par1_incII
    tipos:
    - prazo_relativo
    trecho: II - o Estado ou o Distrito Federal deverá pronunciar-se no prazo máximo de 60 (sessenta) dias, contado da data do respectivo protocolo.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art134_par2
    tipos:
    - prazo_relativo
    trecho: § 2º O prazo previsto no inciso II do caput deste artigo poderá ser prorrogado uma única vez por igual período nos casos em que houver fiscalização em andamento no momento da apresentação do pedido de homologação.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art134_par3
    tipos:
    - prazo_relativo
    trecho: § 3º Na ausência de resposta ao pedido de homologação nos prazos a que se referem o inciso II do caput, o inciso II do § 1º e o § 2º deste artigo, os respectivos saldos credores serão considerados homologados.
