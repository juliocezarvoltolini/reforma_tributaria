    trecho: 'Art. 144. Observados a forma e os prazos estabelecidos no regulamento único do IBS:'
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art144_incI_ali-a
    tipos:
    - ano
    - data_explicita
    trecho: a) inventariar as mercadorias a que se refere o art. 142 desta Lei Complementar existentes em estoque ao final do dia 31 de dezembro de 2032, em cada um dos seus estabelecimentos;
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art144_incII
    tipos:
    - prazo_relativo
    trecho: II - o Estado e o Distrito Federal informarão ao CGIBS, em até 60 (sessenta) dias contados do recebimento do demonstrativo previsto na alínea “c” do inciso I deste caput, o valor que será utilizado para compensação em 12 (doze) parcelas mensais, iguais e sucessivas com o montante de IBS devido pelo contribuinte nos meses subsequentes; e
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art144_incIII
    tipos:
    - prazo_relativo
    trecho: III - caso não seja prestada a informação a que se refere o inciso II deste artigo no prazo nele assinalado, o CGIBS utilizará o valor constante do demonstrativo previsto na alínea “c” do inciso I do caput deste artigo para efeito da referida compensação.
