    trecho: Art. 139. Na impossibilidade de compensação, alternativamente às hipóteses previstas no art. 138 desta Lei Complementar, o titular do direito ao saldo credor homologado poderá ser ressarcido, em espécie, pelo CGIBS, em 240 (duzentas e quarenta) parcelas mensais, iguais e sucessivas ou, em relação às compensações em curso, pelo prazo remanescente.
