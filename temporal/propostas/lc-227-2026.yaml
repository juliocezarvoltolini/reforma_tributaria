    - prazo_relativo
    trecho: § 2º Na hipótese em que o ressarcimento seja efetuado após o prazo previsto no § 1º deste artigo, o respectivo valor será atualizado a partir do nonagésimo primeiro dia com base na taxa referencial do Sistema Especial de Liquidação e de Custódia (Selic).
