  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art51_incI_ali-b
    tipos:
    - ano
    trecho: b) até 50% (cinquenta por cento) nos exercícios financeiros de 2027 e 2028; e
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art51_incII_ali-a
    tipos:
    - ano
    trecho: a) 2% (dois por cento) no exercício financeiro de 2029;
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art51_incII_ali-b
    tipos:
    - ano
    trecho: b) 1% (um por cento) no exercício financeiro de 2030;
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art51_incII_ali-c
