  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art52
    tipos:
    - ano
    trecho: Art. 52. O orçamento do CGIBS para os exercícios financeiros de 2025 a 2028 será composto dos montantes previstos no art. 484 da Lei Complementar nº 214, de 16 de janeiro de 2025, acrescidos das demais receitas previstas para o CGIBS no período.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art52_par1
    tipos:
    - ano
    trecho: § 1º O orçamento do CGIBS para os exercícios financeiros de 2026 a 2028 será proposto pelo Conselho Superior do CGIBS e aprovado nos termos dos §§ 2º a 4º do art. 47 desta Lei Complementar, não se aplicando o limite de valor previsto no referido artigo.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art52_par2
    tipos:
    - ano
    trecho: § 2º Nos exercícios financeiros de 2029 a 2032, o valor da receita do IBS destinada à manutenção do CGIBS, prevista na proposta de orçamento do CGIBS de que trata o inciso II do caput do art. 47, não poderá ser superior à aplicação do percentual previsto nas alíneas “a” a “d” do inciso II do caput do art. 51 desta Lei Complementar sobre a estimativa de arrecadação do IBS para o respectivo exercício.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art52_par3
    tipos:
    - ano
    trecho: § 3º Compete ao Conselho Superior do CGIBS a aprovação da proposta orçamentária do CGIBS para o exercício financeiro de 2025 e de seus créditos suplementares e especiais.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art52_par4
    tipos:
    - ano
    - prazo_relativo
    trecho: § 4º O CGIBS publicará no Diário Oficial da União, por meio de resolução, o orçamento do CGIBS para o exercício financeiro de 2025 no prazo de até 120 (cento e vinte) dias, contado da data da eleição do Presidente do CGIBS. Produção de efeitos
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art52_par5
    tipos:
    - ano
    - prazo_relativo
    trecho: § 5º O orçamento do CGIBS para o ano de 2026 será proposto pelo Conselho Superior em até 120 (cento e vinte) dias contados da data de eleição do Presidente do CGIBS, não se aplicando o prazo previsto no caput do art. 47 desta Lei Complementar. Produção de efeitos
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art52_par6
    tipos:
    - ano
    trecho: § 6º Para fins de custeio das despesas necessárias à instalação do CGIBS, conforme disposto no art. 14 da Emenda Constitucional nº 132, de 20 de dezembro de 2023, os recursos oriundos do financiamento da União ao CGIBS aportados nos exercícios financeiros de 2025 a 2028 poderão ser utilizados para pagamento de despesas correntes, inclusive despesas com pessoal, e para despesas de capital, ficando caracterizado o atendimento do disposto no inciso III e não se aplicando a vedação prevista no inciso X, ambos do caput do art. 167 da Constituição Federal, quanto a esses recursos.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art52_par7
    tipos:
    - ano
    trecho: § 7º A abertura de créditos adicionais no período de 2026 a 2032 observará o disposto no § 7º do art. 47, com a readequação dos limites de acordo com o art. 51, ambos desta Lei Complementar.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art52_par8
    tipos:
    - ano
    - a_partir_de_ate
    trecho: § 8º Excepcionalmente em relação ao exercício de 2025, o CGIBS publicará os relatórios previstos nos arts. 41 e 42 desta Lei Complementar até o final do mês de janeiro de 2026.
