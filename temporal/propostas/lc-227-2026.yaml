    - data_explicita
    trecho: Art. 132. Os saldos credores relativos ao ICMS existentes em 31 de dezembro de 2032 serão reconhecidos pelos Estados e pelo Distrito Federal e utilizados pelos contribuintes nos termos deste Capítulo.
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art132_par1_incI
    tipos:
    - ano
    - data_explicita
    trecho: I - seja admitido pela legislação estadual ou distrital vigente em 31 de dezembro de 2032 e decorra de operações ocorridas até a referida data;
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art132_par1_incII
    tipos:
    - ano
    - data_explicita
    trecho: II - esteja regularmente apurado na escrituração fiscal do estabelecimento, ainda que a escrituração tenha sido realizada após 31 de dezembro de 2032;
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art132_par1_incIII
    tipos:
    - ano
    - data_explicita
    - a_partir_de_ate
    trecho: III - não tenha sido compensado ou utilizado pelo contribuinte até 31 de dezembro de 2032; e
  - urn: urn:lex:br:federal:lei.complementar:2026-01-13;227!art132_par2
    tipos:
    - prazo_relativo
    trecho: § 2º Consideram-se homologados os créditos reconhecidos após o prazo a que se refere o caput deste artigo, inclusive os resultantes de decisões administrativas definitivas ou judiciais com trânsito em julgado favoráveis ao sujeito passivo.
