  tipo: ajuste.sinief
  orgao: CONFAZ
  titulo: Ajuste SINIEF 24/24
  numero: 24/24
  data: '2024-12-06'
  ementa: Estabelece padronização de registro de informações referentes ao IBS, à CBS e ao IS - nos documentos
    fiscais eletrônicos que menciona.
  url: https://www.confaz.fazenda.gov.br/legislacao/ajustes/2024/AJ024_24
  publicacao_dou: Publicado no DOU de 12.12.24, pelo Despacho 53/24
  conferir:
  - Estabelece padronização de registro de informações referentes ao IBS, à CBS e ao IS - nos documentos
    fiscais eletrônicos que menciona.
  - 'Os documentos fiscais eletrônicos indicados a seguir conterão campos para registro de informações
    referentes ao Imposto sobre Bens e Serviços - IBS, à Contribuição Social sobre Bens e Serviços - CBS
    - e ao Imposto Seletivo - IS:'
  observacao: 'Critério do levantamento: menciona IBS/CBS/IS no texto. Cláusula primeira lista: NF-e (Ajuste
    SINIEF 7/05), CT-e (9/07), MDF-e (21/10), NFC-e (19/16), BP-e (1/17), NF3e (1/19), CT-e OS (36/19),
    GTV-e (3/20), DC-e (5/21), NFCom (7/22). Cláusula segunda: entra em vigor na data da publicação no
    DOU. A página não traz nota "Alterado por" e nenhum ajuste 2023-2026 baixado cita o Ajuste SINIEF
    24/24. A meta description do portal está vazia; a ementa foi lida no corpo do texto e confere com
    o Despacho 53/24 (https://www.confaz.fazenda.gov.br/legislacao/despacho/2024/dp053_24). A NFGas (Ajuste
    SINIEF 38/25, posterior) não consta da lista.'
