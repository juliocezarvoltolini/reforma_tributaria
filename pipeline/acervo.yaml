  titulo: Convênio ICMS 100/26
  numero: 100/26
  data: '2026-09-04'
  ementa: Autoriza a concessão de isenção do ICMS nas saídas de fármacos e medicamentos fabricados por
    Laboratórios Públicos Oficiais e destinados a órgãos da Administração Pública.
  url: https://www.confaz.fazenda.gov.br/legislacao/convenios/2026/CV100_26
  publicacao_dou: Publicado no DOU de 09.09.26, pelo despacho 40/26
  conferir:
  - Autoriza a concessão de isenção do ICMS nas saídas de fármacos e medicamentos fabricados por Laboratórios
    Públicos Oficiais e destinados a órgãos da Administração Pública.
  - II - com redução de alíquotas estabelecidas nos regimes diferenciados da Contribuição Social sobre
    Bens e Serviços - CBS - e do Imposto Sobre Bens e Serviços - IBS.
  observacao: 'Critério do levantamento: menciona IBS/CBS/IS no texto. Não trata de documento fiscal eletrônico.
    É benefício de ICMS: a isenção fica condicionada a que a operação esteja contemplada com redução de
    alíquotas nos regimes diferenciados da CBS e do IBS. A página registra "Ratificação Nacional no DOU
    de 28.09.26, pelo Ato Declaratório 20/26". Cláusula segunda: efeitos de 1º de janeiro de 2027 até
    31 de dezembro de 2028.'
