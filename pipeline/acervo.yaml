# Acervo — decretos, atos infralegais, Ajustes SINIEF e Notas Técnicas.
#
# Arquivados com procedência (fontes/acervo/<id>.<ext>, sha256 em
# fontes/manifest.json sob `acervo/<id>`) e CONFERIDOS, mas NÃO fatiados em
# /normas/: a base não trata a vigência nem os efeitos destes atos, nem liga um
# dispositivo de lei ao ato que o regulamenta. Ver pipeline/acervo.py.
#
# Campos:
#   id        minúsculas, dígitos, '.' e '-' (nome do arquivo arquivado)
#   tipo      chave de acervo.NIVEIS (decreto, instrucao.normativa, resolucao,
#             ajuste.sinief, nota.tecnica, ...): dá o nível de prevalência
#   orgao, titulo, url (canal oficial do tipo — PREMISSAS.md §1.2)
#   conferir  trechos LITERAIS do original; a validação confere cada um contra o
#             texto extraído do arquivo arquivado (só o espaço é normalizado)
#   numero, data (AAAA-MM-DD), versao, documento_fiscal, ementa, situacao —
#             como a fonte os escreve; `numero` também é conferido no original
#   url_listagem  página oficial onde o link aparece
#   bloqueio  o canal oficial recusou servir o original: pendência declarada,
#             sem arquivo (e sem `conferir`)
#
# Levantamento e download: pipeline/baixar.py --acervo. Nenhum campo é
# preenchido de memória (PREMISSAS.md §1.3): o que a fonte não diz fica ausente.

