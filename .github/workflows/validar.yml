name: Validar base normativa

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# As mesmas checagens rodam localmente no hook de pre-commit
# (`git config core.hooksPath .githooks`). Ambos chamam pipeline/verificar.sh,
# para que CI e máquina do contribuidor nunca divirjam — e para que a base siga
# verificável mesmo sem Actions disponível.
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install pyyaml requests

      - name: Verificar base
        run: pipeline/verificar.sh
